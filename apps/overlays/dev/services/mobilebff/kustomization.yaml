---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backend
resources:
  - ../../../../base/backend/mobilebff
configMapGenerator:
  - name: mobilebff-values
    namespace: backend
    files:
      - values.yaml
secretGenerator:
  - name: mobilebff-secrets-values
    namespace: backend
    files:
      - secrets.values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
  - path: patches/helmrelease.yaml
  - path: patches/ocirepository.yaml
